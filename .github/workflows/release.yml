name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # bump-plugin.sh reformats the manifests it edits so the lint job stays happy
      - run: npm install -g prettier

      - name: Auto-bump plugins changed since their last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/auto-bump-plugins.sh

      - name: Release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-plugins.sh
