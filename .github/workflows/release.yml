name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # bump-plugin.sh runs prettier on the manifests it edits
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Auto-bump plugins changed since their last release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run auto-bump

      - name: Release new plugin versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release
