# Template: copy to .github/workflows/testflight.yml and set the env block. Needs repo secrets
# ASC_KEY_P8, P12_BASE64, P12_PASSWORD, PROFILE_BASE64 and variables ASC_KEY_ID, ASC_ISSUER_ID, TEAM_ID
# (set-ci-secrets.sh sets all of them). PRs archive and export to prove signing; only main uploads.
name: TestFlight

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  SCHEME: MyApp
  BUNDLE_ID: com.example.myapp
  SPM_PACKAGE: Engine # local Swift package with the logic tests; drop its steps if there is none
  TEST_MODULE: EngineTests
  XCODEGEN_VERSION: 2.44.1
  TRANSPORTER_VERSION: 4.0.0.4

jobs:
  # macOS minutes bill at 10x Linux: this job only tests, archives and exports.
  ship:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      # `secrets` isn't allowed in step `if:`; fork PRs have no secrets and skip signing.
      HAS_SIGNING: ${{ secrets.P12_BASE64 != '' }}
      TEAM_ID: ${{ vars.TEAM_ID }}
      ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
    steps:
      # Full history is cheap without LFS and gives the mtime step and the change check their commits.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: LFS object list
        run: git lfs ls-files -l | cut -d' ' -f1 | sort > .lfs-ids

      # Keyed on the LFS object ids: 137s of LFS pull became 4s.
      - uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-ids') }}
          restore-keys: lfs-

      - name: LFS pull
        run: git lfs pull

      # Checkout stamps every file "now", so a restored .build would rebuild everything; last-commit
      # times keep unchanged files matching what the cached build recorded.
      - name: Source mtimes from commits
        run: |
          git log --format=@%ct --name-only -- "$SPM_PACKAGE" | python3 -c '
          import os, sys
          seen = set()
          for line in sys.stdin:
              line = line.rstrip("\n")
              if line.startswith("@"):
                  t = int(line[1:])
              elif line and line not in seen and os.path.isfile(line):
                  seen.add(line)
                  os.utime(line, (t, t))
          '

      - name: Package changed?
        id: pkg
        run: |
          before='${{ github.event.before }}'
          if [ "${{ github.event_name }}" != push ] || ! git cat-file -e "$before" 2>/dev/null \
             || ! git diff --quiet "$before" HEAD -- "$SPM_PACKAGE"; then
            echo run=true >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/cache@v4
        if: steps.pkg.outputs.run == 'true'
        with:
          path: ${{ env.SPM_PACKAGE }}/.build
          key: spm-${{ hashFiles(format('{0}/Package.swift', env.SPM_PACKAGE), format('{0}/Sources/**', env.SPM_PACKAGE), format('{0}/Tests/**/*.swift', env.SPM_PACKAGE)) }}
          restore-keys: spm-

      - name: Package tests
        if: steps.pkg.outputs.run == 'true'
        run: scripts/swift-test-shards.sh "$SPM_PACKAGE" "$TEST_MODULE"

      # Pinned release zip: `brew install xcodegen` updates Homebrew on every run.
      - uses: actions/cache@v4
        id: xcodegen
        with:
          path: ~/xcodegen
          key: xcodegen-${{ env.XCODEGEN_VERSION }}

      - name: Install XcodeGen
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          unzip -q /tmp/xcodegen.zip -d ~/xcodegen

      # Never cache any of this: keychains, profiles and keys are rebuilt from secrets every run.
      - name: Signing
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$SCHEME.mobileprovision"
          printf '%s\n%s\n' "$P12_PASSWORD" "$P12_BASE64" | scripts/ci-keychain.sh

      - name: Archive and export
        if: env.HAS_SIGNING == 'true'
        run: |
          export PATH="$HOME/xcodegen/xcodegen/bin:$PATH"
          scripts/testflight.sh --no-upload

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true' && github.event_name != 'pull_request'
        with:
          name: ipa
          path: |
            build/testflight/*.ipa
            build/testflight/AppStoreInfo.plist
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  # Upload is mostly waiting on Apple, so it runs on Linux with Transporter.
  upload:
    needs: ship
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/cache@v4
        id: transporter
        with:
          path: ~/itms
          key: transporter-linux-${{ env.TRANSPORTER_VERSION }}

      # Version and MD5 come from https://transporter.amp.apple.com/transporter/asu/<version>/installers/manifest.json;
      # the MD5 below is for 4.0.0.4 and changes with TRANSPORTER_VERSION.
      - name: Install Transporter
        if: steps.transporter.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/tx.sh "https://transporter.amp.apple.com/transporter/asu/$TRANSPORTER_VERSION/installers/iTMSTransporter_installer_linux_x64_$TRANSPORTER_VERSION.sh"
          echo "7f9e49cc429d4e8e78ab14094b2c9161  /tmp/tx.sh" | md5sum -c -
          sh /tmp/tx.sh --accept --noexec --target /tmp/tx
          mv /tmp/tx/itms ~/itms

      - uses: actions/download-artifact@v4
        with:
          name: ipa

      # Relative paths at the default log level sent the plist, then failed the .ipa with no reason;
      # absolute paths at eXtreme upload. The full log is kept only when the upload fails.
      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          ipa=$(ls "$PWD"/*.ipa)
          if ~/itms/bin/iTMSTransporter -m upload -assetFile "$ipa" -assetDescription "$PWD/AppStoreInfo.plist" \
               -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID" -v eXtreme > transporter.log 2>&1; then
            tail -40 transporter.log
          else
            grep -v -e 'indexing file' -e 'created symlink' transporter.log | tail -300
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: transporter-log
          path: transporter.log
          retention-days: 3
