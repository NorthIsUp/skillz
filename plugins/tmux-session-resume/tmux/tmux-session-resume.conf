# tmux-session-resume — installed block in your tmux.conf.
#
# Managed by tmux-session-resume/install.sh. The lines between the BEGIN/END
# markers are rewritten on each install; edits outside the markers are
# preserved. To uninstall, run install.sh --uninstall.
#
# Requires tmux-resurrect (and recommends tmux-continuum). The install script
# clones them under ~/.config/tmux/plugins/ if missing.

set -g @resurrect-dir                     "$HOME/.local/state/tmux-resurrect"
set -g @resurrect-capture-pane-contents   'on'
set -g @resurrect-save-bash-history       'on'
# Don't let resurrect blindly relaunch `claude` / `node` — our post-restore
# hook does it with the right --resume id.
set -g @resurrect-processes               'vi vim nvim emacs man less more tail top htop'

set -g @continuum-save-interval           '5'
set -g @continuum-restore                 'on'

set -g @resurrect-hook-post-save-all      'bash "__PLUGIN_ROOT__/scripts/claude-presave.sh"'
set -g @resurrect-hook-post-restore-all   'bash "__PLUGIN_ROOT__/scripts/claude-postrestore.sh"'

run-shell '__RESURRECT_DIR__/resurrect.tmux'
run-shell '__CONTINUUM_DIR__/continuum.tmux'
