[tools]
hk = "latest"
pkl = "latest"
watchexec = "latest"
lychee = "latest"
"npm:markdownlint-cli" = "latest"
"npm:prettier" = "latest"
"cargo:typos-cli" = "latest"
actionlint = "latest"

[env]
# Keep output paths predictable for hk + watchers
HK_JOBS = "4"

[tasks.lint]
description = "Run all linters"
run = "hk check --all"

[tasks.fix]
description = "Fix all lint issues that can be auto-fixed"
run = "hk fix --all"

[tasks.pre-commit]
description = "Pre-commit hook entry point"
run = "hk run pre-commit"

[tasks.validate-skills]
description = "Validate SKILL.md frontmatter"
run = "scripts/validate-skills.sh"

[tasks.auto-bump]
description = "Patch-bump every plugin changed since its own release tag (CI, main only)"
run = "scripts/auto-bump-plugins.sh"

[tasks.release]
description = "Tag and GitHub-release any plugin version that has no tag yet (CI, main only)"
run = "scripts/release-plugins.sh"

[tasks.bump]
description = "Bump a plugin's version (usage: mise run bump <plugin> [patch|minor|major])"
run = "scripts/bump-plugin.sh"

[tasks.test-bump]
description = "Self-check bump-plugin.sh (version math + prettier-clean output)"
run = "scripts/test-bump-plugin.sh"

[tasks.test-next-option-id]
description = "Self-check the next-option-id hook"
run = "scripts/test-next-option-id.sh"

[tasks.test-sync-rules]
description = "Self-check sync-rules hook (mirrors rules/, injects only changes)"
run = "scripts/test-sync-rules.sh"

[tasks.version-guard]
description = "Check plugin.json and marketplace.json versions agree"
run = "scripts/version-guard.sh"

[tasks.test-auto-bump]
description = "Self-check auto-bump-plugins.sh (bumps only unreleased-change plugins)"
run = "scripts/test-auto-bump-plugins.sh"

[tasks.unstage-symlink-skills]
description = "Unstage symlinked skills (hk pre-commit entry point)"
run = "scripts/unstage-symlink-skills.sh"

[tasks.auto-push]
description = "Stage all changes, commit, and push (used by mise watch)"
run = "scripts/auto-push.sh"

# Background watcher: `mise run watch-and-push` (keep terminal open) or
# `mise run watch-and-push &` to background. See README for launchd setup.
[tasks.watch-and-push]
description = "Watch repo and auto-push changes to git"
run = """
mise watch \
  --glob 'plugins/**' \
  --glob 'memory/**' \
  --glob '.claude-plugin/**' \
  --debounce 5000 \
  -t auto-push
"""
